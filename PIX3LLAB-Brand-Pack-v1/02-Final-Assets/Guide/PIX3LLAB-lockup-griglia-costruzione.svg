<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">PIX3LLAB — Griglia di costruzione del lockup</title><desc id="desc">Specifiche geometriche e di allineamento condivise dalle versioni chiara e scura.</desc>
<defs>
 <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#17201a" stroke-opacity=".055"/></pattern>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#4277ff"/></marker>
 <style>
 .ink{fill:#17201a} .paper{fill:#f3f0e6} .panel{fill:#fffdf5} .blue{fill:#4277ff} .orange{fill:#ff6534}
 .h1{font-family:Arial,Helvetica,sans-serif;font-size:52px;font-weight:700;letter-spacing:-2px} .h2{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;letter-spacing:1.5px} .body{font-family:'Courier New',Courier,monospace;font-size:17px;font-weight:700} .small{font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:700}
 .guide{stroke:#4277ff;stroke-width:2;stroke-dasharray:8 7;fill:none} .base{stroke:#ff6534;stroke-width:2;stroke-dasharray:6 6;fill:none} .dim{stroke:#4277ff;stroke-width:2;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1440" height="1080" class="paper"/><rect width="1440" height="1080" fill="url(#grid)"/>
<text x="60" y="70" class="h1 ink">Griglia di costruzione del lockup</text>
<text x="62" y="108" class="body" fill="#4f574f">La variante scura cambia il contrasto, non la struttura: stesso box, stessi assi, stesse baseline.</text>

