 <text x="28" y="352" class="small" fill="#4f574f">Il box e la geometria restano identici: 140 × 140.</text>
 <text x="28" y="377" class="small" fill="#4f574f">La cornice DEL logo passa da ink a paper; non si</text>
 <text x="28" y="402" class="small" fill="#4f574f">aggiunge alcun contorno e il nucleo non viene ridotto.</text>
 <text x="28" y="432" class="small" fill="#4f574f">Wordmark e descriptor NON cambiano posizione.</text>
 <text x="28" y="462" class="body orange">CAMBIA IL COLORE, NON LA COSTRUZIONE.</text>
