services:
  app:
    image: ghcr.io/moffoletta/pixel-print-lab:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pixel-print-lab-data:/app/data
      - pixel-print-lab-storage:/app/storage
    env_file:
      - .env

    # environment:
    #   PORT: "3000"
    #   DATABASE_PATH: /app/data/pixel-print-lab.db
    #   UPLOAD_DIRECTORY: /app/storage/uploads
    #   ORDER_FILE_DIRECTORY: /app/storage/orders
    #   CATALOG_DIRECTORY: /app/storage/catalog
    #   ADMIN_USERNAME: admin
    #   ADMIN_PASSWORD: admin
    #   TRUST_PROXY: "false"
    #   SMTP_HOST: smtp.example.com
    #   SMTP_PORT: "587"
    #   SMTP_SECURE: "false"
    #   SMTP_USER: smtp-user
    #   SMTP_PASSWORD: smtp-password
    #   SMTP_FROM: "Pixel Print Lab <noreply@example.com>"
    #   SMTP_TO: orders@example.com
    #   PRUSASLICER_PATH: /usr/local/bin/prusa-slicer-headless
    #   PRUSASLICER_TIMEOUT_MS: "120000"

volumes:
  pixel-print-lab-data:
  pixel-print-lab-storage:
